<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal guide to Taiwan." />
    <title>Taiwan, Recommended</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ8G9Y0rD3IK2LlfWPgU04xyI5jM7fM=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header>
          <p class="eyebrow">A FRIENDLY GUIDE</p>
          <h1>Taiwan,<br /><em>recommended.</em></h1>
          <p class="intro">Places, activities, food, and a few helpful heads-ups.</p>
        </header>
        <nav class="filters" aria-label="Filter recommendations">
          <button class="filter is-active" data-filter="all"><span>✦</span> Everything <b id="all-count"></b></button>
          <button class="filter" data-filter="place"><span>⌂</span> Places to go <b id="place-count"></b></button>
          <button class="filter" data-filter="activity"><span>◌</span> Things to do <b id="activity-count"></b></button>
          <button class="filter" data-filter="food"><span>✱</span> Food to try <b id="food-count"></b></button>
          <button class="filter" data-filter="pass"><span>↝</span> Worth a pass <b id="pass-count"></b></button>
        </nav>
        <label class="search-label" for="search">Find a recommendation</label>
        <input id="search" type="search" placeholder="Try “night market”" autocomplete="off" />
        <section class="recommendation-list" id="recommendation-list" aria-live="polite"></section>
        <p class="sidebar-footer">Made with curiosity and a very hungry itinerary.</p>
      </aside>
      <section class="map-panel" aria-label="Map of Taiwan">
        <div id="map"></div>
        <button id="mobile-toggle" aria-expanded="false">Browse recommendations</button>
        <div class="map-key"><span class="dot place"></span> Place <span class="dot activity"></span> Activity <span class="dot food"></span> Food <span class="dot pass"></span> Pass</div>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="recommendations.js"></script>
    <script src="app.js"></script>
  </body>
</html>
